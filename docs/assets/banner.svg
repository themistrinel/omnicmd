<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="480" r="220" fill="#8b5cf6" opacity="0.12" filter="url(#glow)"/>

  <!-- Top Brand Header -->
  <g transform="translate(100, 70)">
    <!-- App Icon -->
    <rect width="48" height="48" rx="12" fill="url(#accentGrad)"/>
    <path d="M16 24L22 30L32 18" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- App Name & Tagline -->
    <text x="64" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">OmniCmd</text>
    <text x="210" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">| The Keyboard-First AI Command Palette</text>
  </g>

  <!-- Central HUD Mockup Frame -->
  <g transform="translate(200, 140)" filter="url(#cardShadow)">
    <!-- Window Border & Body -->
    <rect width="800" height="420" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Top Search Input Bar -->
    <rect x="24" y="24" width="752" height="60" rx="12" fill="#0b1120" stroke="#4f46e5" stroke-width="1.5"/>
    
    <!-- Search Icon -->
    <circle cx="56" cy="54" r="9" stroke="#818cf8" stroke-width="2" fill="none"/>
    <line x1="63" y1="61" x2="72" y2="70" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Search Text -->
    <text x="88" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#f8fafc" font-weight="500">Explicar trecho de código selecionado</text>
    <rect x="424" y="44" width="2" height="20" fill="#818cf8"/>

    <!-- Provider Badge in Input -->
    <rect x="640" y="36" width="120" height="36" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <circle cx="656" cy="54" r="4" fill="#10b981"/>
    <text x="668" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe">9router / Gemini</text>

    <!-- Divider Line -->
    <line x1="24" y1="104" x2="776" y2="104" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Command Items List -->
    <!-- Item 1 (Selected) -->
    <g transform="translate(24, 120)">
      <rect width="752" height="64" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <rect x="16" y="16" width="32" height="32" rx="8" fill="#312e81"/>
      <text x="26" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#818cf8">⚡</text>
      <text x="64" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Explicar Código</text>
      <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Analisa a lógica, complexidade e casos de borda do código</text>
      <rect x="680" y="20" width="56" height="24" rx="6" fill="#2e1065"/>
      <text x="692" y="36" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#d8b4fe">Enter</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(24, 194)">
      <rect width="752" height="56" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="16" y="12" width="32" height="32" rx="8" fill="#1e293b"/>
      <text x="26" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8">✨</text>
      <text x="64" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Refatorar &amp; Otimizar</text>
      <text x="64" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Melhora legibilidade e performance sem alterar comportamento</text>
      <rect x="696" y="16" width="40" height="24" rx="6" fill="#1e293b"/>
      <text x="708" y="32" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">#2</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(24, 260)">
      <rect width="752" height="56" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="16" y="12" width="32" height="32" rx="8" fill="#1e293b"/>
      <text x="26" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8">🐛</text>
      <text x="64" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Encontrar Bugs &amp; Vulnerabilidades</text>
      <text x="64" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Auditoria estática de erros lógicos, vazamento de memória e segurança</text>
      <rect x="696" y="16" width="40" height="24" rx="6" fill="#1e293b"/>
      <text x="708" y="32" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">#3</text>
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(24, 340)">
      <rect width="752" height="56" rx="10" fill="#050811" stroke="#1e293b" stroke-width="1"/>
      <!-- Clip Context Indicator -->
      <circle cx="24" cy="28" r="4" fill="#3b82f6"/>
      <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Clipboard carregado (2.4 KB)</text>

      <!-- Keybinds hints -->
      <g transform="translate(360, 16)">
        <rect width="50" height="24" rx="6" fill="#1e293b"/>
        <text x="9" y="16" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Alt+1-6</text>
        <text x="56" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Personas</text>
      </g>

      <g transform="translate(480, 16)">
        <rect width="66" height="24" rx="6" fill="#1e293b"/>
        <text x="8" y="16" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">/provider</text>
        <text x="74" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Alternar</text>
      </g>

      <g transform="translate(630, 16)">
        <rect width="40" height="24" rx="6" fill="#1e293b"/>
        <text x="9" y="16" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Esc</text>
        <text x="48" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Fechar</text>
      </g>
    </g>
  </g>
</svg>
