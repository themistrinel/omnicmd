name: Release OmniCmd

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OmniCmd & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OmniCmd ${{ github.ref_name }}'
          releaseBody: |
            ## ✨ OmniCmd ${{ github.ref_name }}
            
            Welcome to the latest release of **OmniCmd** — The Keyboard-First AI Command Palette for Power Users and Developers!
            
            ### 📦 Binaries & Installers
            - **Linux**: `.deb`, `.AppImage`
            - **Windows**: `.msi`, `setup.exe`
            - **macOS**: `.dmg` (Universal binary for Intel & Apple Silicon)
            
            ### 🔑 Configuration
            Remember to configure your API key or custom endpoint (OpenAI, 9router, Ollama, Local AI) directly in the Settings menu (`/settings` or via the system tray icon).
            
            ---
            *Built with Tauri v2, Rust and React.*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
