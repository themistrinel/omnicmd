name: Release OmniCmd

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Ubuntu / Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine Release Tag
        id: tag_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag will be: ${TAG}"

      - name: Build OmniCmd & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag_info.outputs.tag }}
          releaseName: 'OmniCmd ${{ steps.tag_info.outputs.tag }}'
          releaseBody: |
            ## ✨ OmniCmd ${{ steps.tag_info.outputs.tag }}
            
            Welcome to the latest release of **OmniCmd** — The Keyboard-First AI Command Palette for Power Users, Developers, and Linux/Hyprland enthusiasts!
            
            ### 🚀 Quick Install on Arch Linux / Hyprland
            ```bash
            curl -fsSL https://raw.githubusercontent.com/themistrinel/omnicmd/main/scripts/install-arch-hyprland.sh | bash
            ```
            
            ### 📦 Binaries & Installers
            - **Linux (Arch, Ubuntu, Debian, Fedora)**: `.deb`, `.AppImage`, tarball
            - **Windows**: `.msi`, `setup.exe`
            - **macOS**: `.dmg` (Universal binary for Intel & Apple Silicon)
            
            ### ⚡ Hyprland & Shortcuts
            - Default toggle shortcut: `SUPER + SPACE` (configured via `omnicmd-toggle`)
            - Built-in update checker: runs automatically or run `omnicmd-update` from your terminal.
            
            ### 🔑 Configuration
            Configure your AI keys directly in the settings menu (`/settings` or via `Ctrl+,`).
            
            ---
            *Automated release build by GitHub Actions.*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
