name: CI & Quality Checks

on:
  push:
    branches:
      - main
      - master
      - feat-develop
  pull_request:
    branches:
      - main
      - master
      - feat-develop
  workflow_dispatch:

jobs:
  lint-and-test-frontend:
    name: Frontend (Lint, Tests & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter (oxlint)
        run: pnpm lint

      - name: Run Frontend Tests
        run: pnpm test

      - name: Build App (Typecheck & Vite)
        run: pnpm build

      - name: Build Landing Page
        run: pnpm build:landing

  check-shell-scripts:
    name: Shell Scripts Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Shell Scripts Syntax
        run: |
          for script in scripts/*.sh install.sh; do
            if [ -f "$script" ]; then
              echo "Checking syntax: $script"
              bash -n "$script"
            fi
          done

  backend-rust:
    name: Backend Rust & Tauri Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Ubuntu / Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Ensure frontend dist directory exists for Tauri proc-macro
        run: mkdir -p dist && touch dist/index.html

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
